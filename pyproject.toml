[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maat-forge"
version = "0.1.0"
description = "Explainable synthetic fraud campaign generator and benchmark forge"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dr. Ahmed Mohamed El Sayed"}]

[project.scripts]
maat = "maat_forge.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
